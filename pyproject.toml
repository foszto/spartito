[project]
name = "spartito"
# The one place of the version: `uv version <new>` bumps it; the package reads it from the
# installed metadata (orchestrator.__version__). A release tag is `v<version>` (docs/releasing.md).
version = "0.2.0"
description = "Run Claude Code and Codex agents in parallel, each in its own git worktree, steered through one orchestrator agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = [
    "agents",
    "ai",
    "claude-code",
    "codex",
    "coding-agents",
    "git-worktree",
    "mcp",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4.16.0",
    "mcp>=2.3.0",
    "starlette>=1.10.0",
    "typer>=0.29.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# The native window of `spartito app`: Cocoa on macOS (pyobjc); Qt on Linux (pywebview's own `qt`
# extra: PyQt6 and PyQt6-WebEngine, GPL-3.0, installed only with this extra and only there).
# On macOS also the notifications Spartito posts itself (UserNotifications, MIT).
app = [
    "pywebview>=6.2; sys_platform == 'darwin'",
    "pyobjc-framework-UserNotifications>=13.0; sys_platform == 'darwin'",
    "pywebview[qt]>=6.2; sys_platform == 'linux'",
]
# The menu-bar status item of `spartito menubar` (macOS only): Cocoa through pyobjc.
menubar = ["pyobjc-framework-Cocoa>=13.0; sys_platform == 'darwin'"]

[project.urls]
Homepage = "https://github.com/foszto/spartito"
Repository = "https://github.com/foszto/spartito"
Issues = "https://github.com/foszto/spartito/issues"
Documentation = "https://github.com/foszto/spartito/tree/master/docs"
Changelog = "https://github.com/foszto/spartito/blob/master/CHANGELOG.md"

[project.scripts]
spartito = "orchestrator.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is `spartito`; the import package keeps its name `orchestrator`.
module-name = "orchestrator"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
