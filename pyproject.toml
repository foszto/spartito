[project]
name = "orchestrator"
version = "0.1.0"
description = "A small orchestrator for fleets of coding agents (Claude Code, Codex) in git worktrees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.16.0",
    "mcp>=2.3.0",
    "starlette>=1.10.0",
    "typer>=0.29.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
orch = "orchestrator.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
